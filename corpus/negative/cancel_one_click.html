<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Subscription - FastSaaS</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 600px; margin: auto; }
    .card { border: 1px solid #e2e8f0; padding: 25px; border-radius: 8px; }
    .btn-cancel { background: #ef4444; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Subscription & Billing</h2>
    <p>Current plan: <strong>Standard ($29/month)</strong></p>
    <p>You can cancel your subscription at any time with one click. Your access will remain active until the end of your billing cycle.</p>
    <!-- Fair design: Visible, straightforward cancellation button without shaming -->
    <button class="btn-cancel" id="btn-cancel-sub">Cancel Subscription</button>
  </div>
</body>
</html>
