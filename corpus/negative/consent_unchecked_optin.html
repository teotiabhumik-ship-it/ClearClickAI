<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Newsletter Signup</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 450px; margin: auto; }
    .row { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Stay Updated</h2>
  <div class="row">
    <!-- Fair design: Unticked by default -->
    <input type="checkbox" id="news_optin" />
    <label for="news_optin">Email me product updates once a month (optional)</label>
  </div>
  <button class="btn">Save Preferences</button>
</body>
</html>
