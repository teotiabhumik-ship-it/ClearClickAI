<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transparent Booking Checkout</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 550px; margin: auto; }
    .box { border: 1px solid #cbd5e1; border-radius: 8px; padding: 24px; }
    .line { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; color: #1e293b; }
    .total { font-size: 24px; font-weight: bold; border-top: 2px solid #0f172a; padding-top: 14px; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>All-Inclusive Pricing</h2>
    <div class="line"><span>Nightly Rate:</span><span>$120.00</span></div>
    <div class="line"><span>Local Taxes & Fees:</span><span>$18.00</span></div>
    <div class="line"><span>Cleaning Fee:</span><span>$25.00</span></div>
    <!-- Fair design: All fees presented upfront in equal size and clear contrast -->
    <div class="line total"><span>Total Price:</span><span>$163.00</span></div>
  </div>
</body>
</html>
