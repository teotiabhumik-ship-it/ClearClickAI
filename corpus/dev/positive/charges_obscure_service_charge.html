<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Express Checkout</title>
  <style>
    body { font-family: sans-serif; padding: 25px; max-width: 480px; margin: auto; }
    .obscure-fee { font-size: 9px; color: #94a3b8; }
  </style>
</head>
<body>
  <h2>Cart Total</h2>

</body>
</html>
