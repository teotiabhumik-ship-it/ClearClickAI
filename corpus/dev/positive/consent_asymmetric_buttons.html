<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookie Privacy Banner</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f3f4f6; padding: 20px; }
    .cookie-banner {
      position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 650px;
      margin: auto; background: #ffffff; padding: 24px; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 1px solid #e5e7eb;
    }
    .cookie-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; color: #111827; }
    .cookie-text { font-size: 14px; color: #4b5563; line-height: 1.5; margin-bottom: 20px; }
    .button-group { display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
    
    /* Dark pattern: Asymmetric visual weight */
    .btn-accept {
      background-color: #059669; color: #ffffff; font-weight: 700; font-size: 16px;
      padding: 12px 28px; border-radius: 8px; border: none; cursor: pointer;
      box-shadow: 0 4px 6px rgba(5, 150, 105, 0.3);
    }
    .btn-reject {
      background: transparent; color: #9ca3af; font-size: 12px; border: none;
      text-decoration: underline; cursor: pointer; padding: 4px 8px;
    }
  </style>
</head>
<body>
  <h1>Welcome to TechPortal</h1>
  <p>Read the latest technology reviews and tutorials.</p>

  <div class="cookie-banner" id="cookie-banner">
    <div class="cookie-title">We value your privacy</div>
    <div class="cookie-text">
      We and our 428 partners use tracking cookies and device identifiers to show personalized ads and measure engagement.
    </div>
    <div class="button-group">
      <button class="btn-reject" id="btn-reject">Reject optional cookies</button>
      <button class="btn-accept" id="btn-accept">Accept All Cookies</button>
    </div>
  </div>
</body>
</html>
