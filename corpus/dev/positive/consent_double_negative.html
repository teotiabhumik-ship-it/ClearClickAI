<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Communication Settings</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 500px; margin: auto; }
    .checkbox-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Communication Preferences</h2>
  <div class="checkbox-row">

  </div>
</body>
</html>
