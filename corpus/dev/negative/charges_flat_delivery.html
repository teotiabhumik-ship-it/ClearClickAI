<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Cart with Clear Delivery</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 500px; margin: auto; }
    .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>Shopping Cart</h2>
  <div class="row"><span>Product (Canvas Bag):</span><span>$25.00</span></div>
  <!-- Tricky Clean: Explicit, clear upfront shipping fee with high contrast (black on white) -->
  <div class="row" style="color: #0f172a; font-size: 14px;"><span>Standard Shipping:</span><span>$5.00</span></div>
  <div class="row" style="font-size: 18px; font-weight: bold; border-top: 1px solid #ccc; padding-top: 8px;"><span>Total:</span><span>$30.00</span></div>
</body>
</html>
