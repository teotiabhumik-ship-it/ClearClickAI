<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clean Signup</title>
  <style>body { font-family: sans-serif; padding: 30px; max-width: 450px; margin: auto; }</style>
</head>
<body>
  <h2>Create Account</h2>
  <div style="display: flex; gap: 8px; margin: 15px 0;">
    <input type="checkbox" id="terms" />
    <label for="terms">I have read and agree to the Terms of Service and Privacy Policy.</label>
  </div>
  <button style="padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 4px;">Sign Up</button>
</body>
</html>
