<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cancellation Step 4 of 6</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 500px; margin: auto; }
    .step-box { border: 1px solid #cbd5e1; padding: 25px; border-radius: 8px; }
    .badge { background: #fef3c7; color: #b45309; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .btn-stay { background: #3b82f6; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
    .btn-continue { background: #e2e8f0; color: #475569; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; margin-left: 10px; }
  </style>
</head>
<body>
  <div class="step-box">
    <span class="badge" id="step-indicator">Step 4 of 6: Special Retention Offer</span>
    <h3>Are you absolutely positive?</h3>
    <p>Signing up took 1 single click. Cancelling requires completing 6 feedback surveys and offer confirmations.</p>
    <div>
      <button class="btn-stay">Accept Free Month and Stay</button>
      <button class="btn-continue" id="continue-cancel">Continue to Cancellation Step 5</button>
    </div>
  </div>
</body>
</html>
