<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Registration - Example Shop</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 30px; max-width: 480px; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; }
    input[type="text"], input[type="email"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .checkbox-group { display: flex; align-items: flex-start; gap: 8px; margin-top: 15px; }
    .checkbox-group input { margin-top: 3px; }
    .checkbox-group label { font-weight: normal; font-size: 14px; line-height: 1.4; }
    button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Create your account</h2>
  <form>
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" value="Jane Doe" />
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" value="jane@example.com" />
    </div>

    <!-- Dark pattern: Pre-ticked consent for marketing and 3rd party sharing -->
    <div class="checkbox-group">
      <input type="checkbox" id="marketing_optin" checked />
      <label for="marketing_optin" id="label_marketing">Yes, send me promotional newsletters, partner offers, and share my profile with third-party advertising networks.</label>
    </div>

    <!-- Clean checkbox: terms and conditions -->
    <div class="checkbox-group">
      <input type="checkbox" id="terms" />
      <label for="terms">I agree to the Terms of Service and Privacy Policy.</label>
    </div>

    <button type="button">Complete Registration</button>
  </form>
</body>
</html>
