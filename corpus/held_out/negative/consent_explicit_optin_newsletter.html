<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Optional Newsletter</title>
  <style>body { font-family: sans-serif; padding: 25px; max-width: 480px; margin: auto; }</style>
</head>
<body>
  <h2>Stay in Touch</h2>
  <div style="display: flex; gap: 8px; margin: 15px 0;">
    <!-- Clean: Unchecked by default -->
    <input type="checkbox" id="news_opt" />
    <label for="news_opt">Send me weekly software tutorials and release announcements (optional)</label>
  </div>
  <button style="padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 6px;">Save Preference</button>
</body>
</html>
