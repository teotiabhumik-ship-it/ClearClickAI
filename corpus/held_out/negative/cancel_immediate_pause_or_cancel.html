<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Subscription</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 550px; margin: auto; }
    .card { border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; }
    .btn-row { display: flex; gap: 10px; margin-top: 15px; }
    .btn { padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Subscription Control</h2>
    <p>Need a break or want to stop service? You have full control:</p>
    <div class="btn-row">
      <button class="btn" style="background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1;">Pause for 1 Month</button>
      <button class="btn" style="background: #fee2e2; color: #991b1b; border: 1px solid #f87171;">Cancel Subscription Now</button>
    </div>
  </div>
</body>
</html>
