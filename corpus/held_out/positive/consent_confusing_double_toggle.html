<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Privacy Toggles</title>
  <style>body { font-family: sans-serif; padding: 30px; max-width: 500px; margin: auto; }</style>
</head>
<body>
  <h2>Privacy Controls</h2>
  <div style="display: flex; gap: 10px; margin-top: 15px;">
    <input type="checkbox" id="neg_toggle" checked />
    <!-- Dark pattern: confusing opt-out double negative -->
    <label for="neg_toggle">Prevent us from not sharing browsing logs with advertising analytics partners.</label>
  </div>
</body>
</html>
