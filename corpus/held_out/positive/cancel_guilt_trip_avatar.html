<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cancel Subscription</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 450px; margin: auto; text-align: center; }
    .btn-keep { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-shame { background: none; border: none; color: #dc2626; font-size: 13px; text-decoration: underline; margin-top: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Are you sure you want to break our heart?</h2>
  <p>Our little mascot is crying because you want to cancel your membership!</p>
  <button class="btn-keep">Stay and make us happy</button>
  <br>
  <!-- Dark pattern: Confirm-shaming guilt trip -->
  <button class="btn-shame">No thanks, I like overpaying and prefer to lose my progress</button>
</body>
</html>
