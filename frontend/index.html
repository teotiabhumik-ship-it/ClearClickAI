<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClearClick AI — Evidence-Based Dark Pattern Auditor</title>
    <meta name="description" content="Audit web pages and checkouts for deceptive design patterns, hidden charges, subscription traps, and asymmetric choices with evidence-based proof markups." />
    <meta name="keywords" content="dark patterns, deceptive design, checkout audit, hidden fees, drip pricing, consent choices, consumer protection" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="ClearClick AI" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClearClick AI — Evidence-Based Dark Pattern Auditor" />
    <meta property="og:description" content="Automated proofreader markups flagging withheld fees, forced add-ons, and asymmetric choices on e-commerce and subscription sites." />
    <meta property="og:image" content="/logo.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClearClick AI — Evidence-Based Dark Pattern Auditor" />
    <meta name="twitter:description" content="Automated proofreader markups flagging withheld fees, forced add-ons, and asymmetric choices." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Structured Data (JSON-LD) for Schema.org Search Presence -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ClearClick AI",
      "url": "https://clearclick-ai.vercel.app/",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "All",
      "description": "Inspect web pages for misleading interface patterns, hidden fees, and asymmetric choices.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <script type="text/javascript">
      // Ensure dark mode is completely removed and stripped
      document.documentElement.classList.remove('dark');
      try { localStorage.removeItem('clearclick_theme'); } catch(e) {}
      // Restore SPA URL if redirected from static hosting 404.html
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-paper text-ink font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
